{% extends "base.html" %}

{% block content %}

<h2>Create an Account</h2>

{% if error %}
    <p style="color: red;">{{error}}</p>
{% endif %}

<form method="post" action="{% url 'create' %}">
    {% csrf_token %}

    <label for="student_id">Student ID:</label>
    <input type="student_id" id="student_id" name="student_id" minlength="8" maxlength="8" pattern="\d{8}" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>

    <label for="meal_plan">Select Meal Plan:</label>
    <select id="meal_plan" name="plan" required>
        {% for plan in meal_plans %}
            <option value="{{plan.id}}">{{plan.id}}</option>
        {% endfor %}
    </select>

    <button type="submit">Create</button>
</form>

{% endblock %}
